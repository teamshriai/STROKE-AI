# Stroke-AI — nginx site config
#
# Serves the built frontend as static files and proxies /api/ to the FastAPI
# backend on localhost:8000, so both come from ONE origin. That is why the
# frontend needs no VITE_API_BASE_URL in production: it calls /api/... relative.
#
# Install:
#   sudo cp deploy/nginx-stroke-ai.conf /etc/nginx/sites-available/stroke-ai
#   sudo ln -sf /etc/nginx/sites-available/stroke-ai /etc/nginx/sites-enabled/stroke-ai
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # Replace with the real hostname once DNS points here, e.g.
    #   server_name demo.stroke-ai.org;
    server_name _;

    root /var/www/stroke-ai;
    index index.html;

    # A full thin-slice NCCT series is often 250 MB+ and the Brain Haemorrhage
    # Pathway page uploads every slice. nginx defaults to 1 MB, which would
    # reject those uploads with "413 Request Entity Too Large".
    client_max_body_size 600M;

    # Client-side routing: any unknown path must return index.html, otherwise
    # loading/refreshing /app or /app/brain-haemorrhage-pathway gives a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames, so these are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream the upload straight through rather than buffering the whole
        # series to disk first.
        proxy_request_buffering off;

        # A large upload plus CPU inference can outrun nginx's 60 s default.
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
