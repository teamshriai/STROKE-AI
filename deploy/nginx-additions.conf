# Stroke-AI — additions for the EXISTING nginx site config
#
# The server already has a working config for stroke-ai.org (with the certbot
# TLS block). Do NOT replace that file — add the three pieces below into the
# server block that serves the site, i.e. the `listen 443 ssl` one.
#
#   sudo nano /etc/nginx/sites-available/stroke-ai.org
#   sudo nginx -t && sudo systemctl reload nginx
#
# ---------------------------------------------------------------------------
# 1. At the server-block level (next to `root` / `server_name`)
# ---------------------------------------------------------------------------
# A full thin-slice NCCT series is often 250 MB+ and the Brain Haemorrhage
# Pathway page uploads every slice. nginx defaults to 1 MB and would reject
# the upload with "413 Request Entity Too Large".

    client_max_body_size 600M;

# ---------------------------------------------------------------------------
# 2. Replace the existing `location / { ... }` with this
# ---------------------------------------------------------------------------
# The site used to be a single page, so a plain `try_files $uri $uri/ =404`
# was fine. Now that routing is client-side, any unknown path has to return
# index.html or /app and /app/brain-haemorrhage-pathway 404 on load/refresh.

    location / {
        try_files $uri $uri/ /index.html;
    }

# ---------------------------------------------------------------------------
# 3. Add this block (Vite emits content-hashed filenames — safe to cache hard)
# ---------------------------------------------------------------------------

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

# ---------------------------------------------------------------------------
# 4. Add this block — routes the API to the backend service on localhost
# ---------------------------------------------------------------------------
# Because the API is served from the same hostname as the frontend, the built
# frontend calls /api/... relative and needs no configuration.

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream the upload through instead of buffering the whole series first
        proxy_request_buffering off;

        # A large upload plus CPU inference outruns nginx's 60s default
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

# ---------------------------------------------------------------------------
# Also confirm `root` points at the BUILD directory, not the repo root:
#
#     root /var/www/stroke-ai.org/dist;
#
# If it pointed at /var/www/stroke-ai.org the whole repository would be
# web-readable, including server/test_data with the demo DICOM studies.
# ---------------------------------------------------------------------------
